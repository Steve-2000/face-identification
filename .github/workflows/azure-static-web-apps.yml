
name: Build and Deploy to Azure VM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_AZURE_ENDPOINT: ${{ secrets.VITE_AZURE_ENDPOINT }}
          VITE_AZURE_KEY: ${{ secrets.VITE_AZURE_KEY }}
        run: npm run build

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.AZURE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.AZURE_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy built index.html to VM
        env:
          HOST: ${{ secrets.AZURE_HOST }}
          USERNAME: ${{ secrets.AZURE_USERNAME }}
        run: |
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            dist/index.html \
            "$USERNAME@$HOST:/var/www/face-identification/dist/index.html"
